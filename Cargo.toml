[package]
authors = ['Piotr Olszewski <asmie@asmie.pl>']
name = "stamp-suite"
version = "1.0.0"
edition = "2021"
# Criterion 0.8 sets the minimum for tests and distribution builds.
rust-version = "1.86.0"

categories = [
    "network-programming",
    "development-tools",
    "command-line-utilities",
]

keywords = ["stamp", "rfc8762", "rfc8972", "network-measurement", "twamp"]

license = "MIT"

homepage = "https://github.com/asmie/stamp-suite"
repository = "https://github.com/asmie/stamp-suite"

description = "Simple Two-Way Active Measurement Protocol (STAMP)"

readme = "README.md"

# Local test/review evidence is separate from the crates.io source package.
exclude = ["doc/interop/**", "doc/review/**", "proptest-regressions/**", "THIRD_PARTY_NOTICES.txt"]

[features]
default = []
ttl-nix = ["dep:nix"]
ttl-pnet = ["dep:pnet"]
metrics = ["dep:axum", "dep:metrics", "dep:metrics-exporter-prometheus"]
# Reflector REST API: sessions, keys, caps, drain and shutdown.
# Includes TLS support; runtime configuration selects HTTP or HTTPS.
# See doc/control-plane.md.
control = [
    "dep:axum",
    "dep:axum-server",
    "dep:rustls",
]
snmp = []
# Kernel RX timestamps on Linux/macOS; Linux TX and NIC timestamps.
# `--hwtstamp on` configures the NIC. Other platforms use application timestamps.
# ETHTOOL_GET_TS_INFO probing is always built. No extra dependencies.
hwtstamp = []

[dependencies]
getrandom = "0.4"
socket2 = { version = "0.6", features = ["all"] }
clap = { version = "4.6", features = ["derive", "env"] }
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "tracing-log"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
thiserror = "2.0"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
subtle = "2.6"
zeroize = "1"
tokio-util = "0.7"

# TTL backend dependencies (all optional, selected by features)
nix = { version = "0.31", optional = true, default-features = false, features = ["socket", "uio", "net"] }
pnet = { version = "0.35", optional = true }

# Metrics dependencies (optional, enabled by "metrics" feature)
axum = { version = "0.8", optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.18", optional = true, default-features = false }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }

[dependencies.tokio]
version = "1.53"
features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync"]

# Platform-specific default backends
# Note: These provide defaults when no explicit ttl-* feature is used.
# Using --features ttl-pnet on Linux will compile both nix and pnet,
# but only pnet will be used at runtime due to cfg checks in mod.rs.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket", "uio", "net"] }

[target.'cfg(target_os = "windows")'.dependencies]
pnet = "0.35"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["html_reports", "cargo_bench_support"] }
# Renders dist/man/stamp-suite.1 from the clap definition (tests/man_page.rs).
clap_mangen = "0.3"

# Linux namespace tests use libc for root checks, setns and IPv6 socket options.
# The test target is Linux-only. libc is already a dependency through nix.
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "reflector_hotpath"
harness = false

# Exclude the fuzz package from the workspace — it has its own
# (libfuzzer-based) build profile, requires nightly rustc, and shouldn't
# be built by default `cargo build` / `cargo test` runs.
[workspace]
exclude = ["fuzz"]

[package.metadata.deb]
maintainer = "Piotr Olszewski <asmie@asmie.pl>"
copyright = "2026, Piotr Olszewski <asmie@asmie.pl>"
license-file = ["LICENSE", "0"]
extended-description = """\
stamp-suite implements the Simple Two-Way Active Measurement Protocol \
(STAMP, RFC 8762 and RFC 8972) to measure round-trip time, packet loss \
and one-way delay. A single binary runs as the Session-Sender or, with \
--is-reflector, as the Session-Reflector. The package installs a systemd \
unit that runs the reflector as the unprivileged stamp user."""
section = "net"
priority = "optional"
depends = "$auto, adduser, init-system-helpers (>= 1.54)"
features = ["ttl-nix", "ttl-pnet", "metrics", "snmp", "hwtstamp", "control"]
maintainer-scripts = "dist/debian/"
assets = [
    ["target/release/stamp-suite",                "usr/bin/",                                  "755"],
    ["dist/man/stamp-suite.1",                    "usr/share/man/man1/",                       "644"],
    ["mibs/STAMP-SUITE-MIB.mib",                  "usr/share/snmp/mibs/",                      "644"],
    ["README.md",                                 "usr/share/doc/stamp-suite/README.md",       "644"],
    ["CHANGELOG.md",                              "usr/share/doc/stamp-suite/CHANGELOG.md",    "644"],
    ["SECURITY.md",                               "usr/share/doc/stamp-suite/SECURITY.md",     "644"],
    ["THIRD_PARTY_NOTICES.txt",                   "usr/share/doc/stamp-suite/THIRD_PARTY_NOTICES.txt", "644"],
    ["doc/usage.md",                              "usr/share/doc/stamp-suite/usage.md",        "644"],
    ["doc/architecture.md",                       "usr/share/doc/stamp-suite/architecture.md", "644"],
    ["doc/security.md",                           "usr/share/doc/stamp-suite/security.md",     "644"],
    ["examples/sender.toml",                      "usr/share/doc/stamp-suite/examples/",       "644"],
    ["examples/reflector.toml",                   "usr/share/doc/stamp-suite/examples/",       "644"],
]

[package.metadata.deb.systemd-units]
unit-scripts = "dist/systemd/"
enable = false
start = false
restart-after-upgrade = true
stop-on-upgrade = false

[package.metadata.generate-rpm]
license = "MIT"
summary = "Simple Two-Way Active Measurement Protocol (STAMP)"
assets = [
    { source = "target/release/stamp-suite",       dest = "/usr/bin/stamp-suite",                         mode = "755" },
    { source = "dist/systemd/stamp-suite.service", dest = "/usr/lib/systemd/system/stamp-suite.service",  mode = "644", config = false },
    { source = "dist/man/stamp-suite.1",           dest = "/usr/share/man/man1/stamp-suite.1",            mode = "644" },
    { source = "mibs/STAMP-SUITE-MIB.mib",         dest = "/usr/share/snmp/mibs/STAMP-SUITE-MIB.mib",     mode = "644" },
    { source = "LICENSE",                          dest = "/usr/share/doc/stamp-suite/LICENSE",           mode = "644", doc = true },
    { source = "THIRD_PARTY_NOTICES.txt",          dest = "/usr/share/doc/stamp-suite/THIRD_PARTY_NOTICES.txt", mode = "644", doc = true },
    { source = "README.md",                        dest = "/usr/share/doc/stamp-suite/README.md",         mode = "644", doc = true },
    { source = "CHANGELOG.md",                     dest = "/usr/share/doc/stamp-suite/CHANGELOG.md",      mode = "644", doc = true },
    { source = "SECURITY.md",                      dest = "/usr/share/doc/stamp-suite/SECURITY.md",       mode = "644", doc = true },
    { source = "doc/usage.md",                     dest = "/usr/share/doc/stamp-suite/usage.md",          mode = "644", doc = true },
    { source = "doc/architecture.md",              dest = "/usr/share/doc/stamp-suite/architecture.md",   mode = "644", doc = true },
    { source = "doc/security.md",                  dest = "/usr/share/doc/stamp-suite/security.md",       mode = "644", doc = true },
    { source = "examples/sender.toml",             dest = "/usr/share/doc/stamp-suite/examples/sender.toml", mode = "644", doc = true },
    { source = "examples/reflector.toml",          dest = "/usr/share/doc/stamp-suite/examples/reflector.toml", mode = "644", doc = true },
]
pre_install_script = """
getent group stamp >/dev/null || groupadd -r stamp
getent passwd stamp >/dev/null || useradd -r -g stamp -s /sbin/nologin -d /nonexistent -c "STAMP Suite service account" stamp
exit 0
"""
post_install_script = """
systemctl daemon-reload || :
systemctl preset stamp-suite.service || :
"""
pre_uninstall_script = """
if [ $1 -eq 0 ]; then
    systemctl --no-reload disable --now stamp-suite.service || :
fi
"""
post_uninstall_script = """
systemctl daemon-reload || :
if [ $1 -ge 1 ]; then
    systemctl try-restart stamp-suite.service || :
fi
"""

[package.metadata.generate-rpm.requires]
shadow-utils = "*"
