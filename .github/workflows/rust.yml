name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, 1.0-line]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default to a read-only token. Jobs that need to upload artifacts or
# create check-runs should opt in explicitly with their own `permissions:`
# block; today nothing on this workflow writes back to the repo.
permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: ""
            name: default
          - features: ttl-nix
            name: ttl-nix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - name: Clippy (${{ matrix.name }})
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo clippy --all --tests --features ${{ matrix.features }} -- -D warnings
          else
            cargo clippy --all --tests -- -D warnings
          fi
        shell: bash

  clippy-pnet:
    name: Clippy (pnet backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-pnet
      # The pnet receiver backend (src/receiver/pnet.rs) is cfg-gated on
      # `feature = "ttl-pnet" AND NOT feature = "ttl-nix"`, so it's
      # compiled out under --all-features on any platform (ttl-nix wins
      # there) and is otherwise not covered by the `clippy` job (which
      # only runs default/ttl-nix legs). This dedicated job is the sole
      # pnet-backend lint gate and a stable, individually addressable
      # required check.
      - name: Clippy (ttl-pnet, no default features)
        run: cargo clippy --no-default-features --features ttl-pnet --tests -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            features: --all-features
          - os: ubuntu-latest
            rust: beta
            features: --all-features
          - os: macos-latest
            rust: stable
            features: ""
          # Still no Windows leg in this *gating* matrix: `pnet` is an
          # unconditional Windows target dependency (see Cargo.toml's
          # `[target.'cfg(target_os = "windows")'.dependencies]`), and its
          # Windows backend `#[link(name = "Packet")]`s against
          # Packet.dll/wpcap.dll -- so any test binary built for this
          # target needs that DLL loadable at process start, even tests
          # that never touch pnet. The free Npcap installer has no
          # silent/unattended mode (that's an OEM-only feature; see
          # nmap/npcap#720 and #545), which is what made this untenable
          # here previously. Build coverage for Windows is preserved by
          # the `build-release` matrix below (linking only needs the
          # Npcap SDK's import libs, not the runtime driver). A
          # *non-gating*, best-effort `test-windows` job now covers
          # actually running the test suite by extracting just the
          # runtime DLLs from the installer instead of running it — see
          # that job for the full rationale. Promoting it into this
          # gating matrix depends on that approach proving reliable
          # across Npcap releases, which hasn't been observed yet.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --verbose ${{ matrix.features }}

  # Best-effort, informational Windows test coverage. NOT part of the
  # gating `test` matrix above -- see the comment on that job for why.
  #
  # `continue-on-error: true` means a red run here never fails the
  # workflow or blocks a PR; the "(best-effort, non-gating)" suffix on
  # the name makes that legible from the checks list without having to
  # open the job.
  #
  # The free Npcap installer cannot be run unattended in CI (no silent
  # mode without an OEM license: nmap/npcap#720, #545), and a prior
  # attempt in this workflow to run it with `/S` anyway simply hung. So
  # instead of running the installer, this job unpacks it as the plain
  # NSIS self-extracting archive it is (via 7-Zip -- installed through
  # Chocolatey, which unlike 7-Zip itself is reliably preinstalled on
  # GitHub-hosted Windows images) and lifts out just the two
  # redistributable DLLs (`Packet.dll`, `wpcap.dll`) that `pnet`'s
  # Windows backend needs loadable at process start. It never
  # registers or starts the actual capture driver/service, which is
  # fine here: the only tests that would need a live driver
  # (`tests/pnet_loopback_test.rs`) are already `#[ignore]`d by default
  # and require CAP_NET_RAW-equivalent privileges this runner doesn't
  # have anyway, so plain `cargo test` never reaches them.
  #
  # If the extraction step ever fails to locate the DLLs (e.g. a future
  # Npcap release changes its installer's internal layout), the test
  # step below will simply fail to launch -- annoying but harmless,
  # since the job is non-gating either way.
  test-windows:
    name: "test-windows (best-effort, non-gating)"
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-windows
      - name: Install Npcap SDK (link-time import libs)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP/npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP/npcap-sdk.zip" -DestinationPath "C:/npcap-sdk"
          echo "LIB=C:/npcap-sdk/Lib/x64" >> $env:GITHUB_ENV
      - name: Extract Npcap runtime DLLs (installer unpacked, never run)
        shell: pwsh
        run: |
          # 7-Zip is not reliably preinstalled on GitHub-hosted Windows
          # images any more (actions/runner-images#9361); Chocolatey is,
          # so use it to guarantee 7z.exe is present rather than assuming
          # a path. `choco` needs no credentials for a public package.
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress | Out-Null
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.88.exe" -OutFile "$env:TEMP/npcap.exe"
          & $sevenZip x "$env:TEMP/npcap.exe" -o"$env:TEMP/npcap-extract" -y | Out-Null
          # The installer is NOT laid out as "32-bit at the root, 64-bit in a
          # subdirectory". Npcap 1.88 ships three architectures under a naming
          # scheme that defeats every path- or name-based heuristic:
          #
          #   Packet.dll,       wpcap.dll        (root)             -> ARM64
          #   Packet_arm64.dll, wpcap_arm64.dll  (root)             -> ARM64
          #   Packet_x64.dll,   wpcap_x64.dll    (root)             -> x64
          #   Packet.dll,       wpcap.dll        ($SYSDIR/Npcap/)   -> x64
          #
          # There is no x64/ directory anywhere, so matching on one selects
          # nothing; and an exact-name match for "Packet.dll"/"wpcap.dll"
          # skips the _x64 copies entirely while picking up the ARM64 ones at
          # the root. Loading a non-x64 DLL into the x64 test binary aborts it
          # with STATUS_INVALID_IMAGE_FORMAT (0xc000007b) before a single test
          # runs. So key on the only thing that cannot drift with installer
          # layout: the PE header's machine type (0x8664 = x64). The two x64
          # copies above are byte-identical, so either is a correct pick.
          function Get-PeMachine([string]$Path) {
            try {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            } catch {
              return 0
            }
          }
          function Format-Machine([uint16]$Machine) {
            switch ($Machine) {
              0x8664  { "x64" }
              0x14c   { "x86" }
              0xaa64  { "ARM64" }
              default { "0x{0:x}" -f $Machine }
            }
          }
          # $PLUGINSDIR holds the installer's own NSIS plugins, never runtime
          # DLLs; excluding it keeps the candidate list to the real payload.
          $all = Get-ChildItem -Path "$env:TEMP/npcap-extract" -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(Packet|wpcap)' -and $_.FullName -notmatch '\$PLUGINSDIR' }
          Write-Host "Candidate DLLs found in the extracted installer:"
          $all | ForEach-Object { Write-Host ("  {0,-6} {1}" -f (Format-Machine (Get-PeMachine $_.FullName)), $_.FullName) }
          $destDir = "C:/npcap-runtime"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          # Stage under the canonical names the loader looks for, whichever
          # source file the x64 build happened to come from.
          $stagedCount = 0
          foreach ($stem in @("Packet", "wpcap")) {
            $pick = $all |
              Where-Object { $_.Name -match "^$stem" -and (Get-PeMachine $_.FullName) -eq 0x8664 } |
              Select-Object -First 1
            if ($pick) {
              Copy-Item $pick.FullName -Destination (Join-Path $destDir "$stem.dll") -Force
              Write-Host "staged $stem.dll (x64) <- $($pick.FullName)"
              $stagedCount++
            } else {
              Write-Warning "No x64 build of $stem.dll inside the extracted Npcap installer."
            }
          }
          if ($stagedCount -eq 2) {
            echo "$destDir" >> $env:GITHUB_PATH
          } else {
            Write-Warning "Incomplete Npcap runtime staged; the test step will fail to launch. Continuing anyway (best-effort job)."
          }
      - name: Run tests (ttl-pnet backend)
        run: cargo test --no-default-features --features ttl-pnet
        shell: bash

  test-features:
    name: Test Features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: ""
            name: default
          - features: ttl-nix
            name: ttl-nix
          - features: ttl-pnet
            name: ttl-pnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-features-${{ matrix.name }}
      - name: Test (${{ matrix.name }})
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --verbose --features ${{ matrix.features }}
          else
            cargo test --verbose
          fi
        shell: bash

  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          # See pin rationale on the test job above.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Npcap SDK (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP/npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP/npcap-sdk.zip" -DestinationPath "C:/npcap-sdk"
          echo "LIB=C:/npcap-sdk/Lib/x64" >> $env:GITHUB_ENV
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check MSRV
        run: cargo check --all-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  package-deb:
    name: Package DEB
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-deb
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build DEB package
        run: cargo deb
      - name: Verify DEB package
        run: |
          DEB=$(ls target/debian/*.deb)
          echo "=== Package info ==="
          dpkg-deb --info "$DEB"
          echo "=== Package contents ==="
          dpkg-deb --contents "$DEB"
          dpkg-deb --contents "$DEB" | grep -q usr/bin/stamp-suite
          dpkg-deb --contents "$DEB" | grep -q lib/systemd/system/stamp-suite.service
          dpkg-deb --contents "$DEB" | grep -q usr/share/snmp/mibs/STAMP-SUITE-MIB.mib
          echo "All expected files present in DEB package."

  package-rpm:
    name: Package RPM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-rpm
      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release --all-features
      - name: Build RPM package
        run: cargo generate-rpm
      - name: Verify RPM package
        run: |
          RPM=$(ls target/generate-rpm/*.rpm)
          echo "=== Package info ==="
          rpm -qip "$RPM"
          echo "=== Package contents ==="
          rpm -qlp "$RPM"
          rpm -qlp "$RPM" | grep -q /usr/bin/stamp-suite
          rpm -qlp "$RPM" | grep -q stamp-suite.service
          rpm -qlp "$RPM" | grep -q STAMP-SUITE-MIB.mib
          echo "All expected files present in RPM package."

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build with Nix
        run: nix build --print-build-logs

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Override the workflow-default contents-read token so the
    # rustsec/audit-check action can post its findings as a check-run
    # (it needs checks:write) and open issues for new advisories
    # (issues:write — optional but harmless).
    #
    # Overlap with `cargo-deny` below: both scan the RustSec advisory
    # database for known vulnerabilities in this crate's dependency tree,
    # so the [advisories] half of that job duplicates this one. Kept side
    # by side deliberately -- this job's value is the PR-annotated
    # check-run and issue-filing on new advisories, which
    # `cargo-deny-action` doesn't do; `cargo deny check` is kept as the
    # single command contributors run locally (see deny.toml) and also
    # covers licenses/bans/sources in the same pass. Small redundancy on
    # the advisories check, not wasted effort.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  mib-lint:
    name: MIB Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsmi tools
        # The package supplying `smilint` is named `smitools` on Ubuntu
        # 24.04+ and `libsmi2-bin` on older Debian/Ubuntu. Try the new
        # name first; fall back so the job survives a base-image bump.
        run: |
          sudo apt-get update
          sudo apt-get install -y smitools || sudo apt-get install -y libsmi2-bin
      - name: Lint STAMP-SUITE-MIB
        # Lint level 4 = errors and major warnings (style nits like missing
        # DESCRIPTION clauses are ignored). Raise to -l 6 once the MIB is
        # clean at level 5.
        run: smilint -l 4 mibs/STAMP-SUITE-MIB.mib
