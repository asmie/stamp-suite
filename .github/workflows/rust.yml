name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, 1.0-line]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default to a read-only token. Jobs that need to upload artifacts or
# create check-runs should opt in explicitly with their own `permissions:`
# block; today nothing on this workflow writes back to the repo.
permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - args: ""
            name: default
          - args: --features ttl-nix
            name: ttl-nix
          - args: --all-features
            name: all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - name: Clippy (${{ matrix.name }})
        run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings
        shell: bash

  clippy-pnet:
    name: Clippy (pnet backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-pnet
      # The pnet receiver backend (src/receiver/pnet.rs) is cfg-gated on
      # `feature = "ttl-pnet" AND NOT feature = "ttl-nix"`, so it's
      # compiled out under --all-features on any platform (ttl-nix wins
      # there) and is otherwise not covered by the `clippy` job (which
      # also runs an all-features leg). This dedicated job is the sole
      # pnet-backend lint gate and a stable, individually addressable
      # required check.
      - name: Clippy (ttl-pnet, no default features)
        run: cargo clippy --locked --no-default-features --features ttl-pnet --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            features: --all-features
          - os: ubuntu-latest
            rust: beta
            features: --all-features
          # Windows has a separate bounded runtime gate below, with its
          # pinned Npcap DLL setup and explicit driver-free test targets.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --locked --verbose ${{ matrix.features }}
      - name: Check live benchmark accounting
        if: runner.os == 'Linux'
        run: cargo test --locked --example live_udp_bench ${{ matrix.features }}

  test-macos:
    name: Native macOS (${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all-features]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-macos-${{ matrix.profile }}
      - name: Run native tests and record evidence
        env:
          TOKIO_WORKER_THREADS: 2
        run: python3 scripts/run_native_tests.py --expected-platform darwin --profile ${{ matrix.profile }} --report native-macos-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos-${{ matrix.profile }}
          path: |
            native-macos-${{ matrix.profile }}.json
            native-macos-${{ matrix.profile }}.log
          if-no-files-found: error

  # Runtime gate for codecs/configuration and UDP sender peers. The full
  # capture-dependent suite remains informational until a driver-backed
  # runner is available. DLL extraction does not install a capture driver.
  test-windows:
    name: "Windows runtime core (capture driver not required)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-windows
      - name: Install Npcap SDK (link-time import libs)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP/npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP/npcap-sdk.zip" -DestinationPath "C:/npcap-sdk"
          echo "LIB=C:/npcap-sdk/Lib/x64" >> $env:GITHUB_ENV
      - name: Extract Npcap runtime DLLs (installer unpacked, never run)
        shell: pwsh
        run: |
          # 7-Zip is not reliably preinstalled on GitHub-hosted Windows
          # images any more (actions/runner-images#9361); Chocolatey is,
          # so use it to guarantee 7z.exe is present rather than assuming
          # a path. `choco` needs no credentials for a public package.
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress | Out-Null
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.88.exe" -OutFile "$env:TEMP/npcap.exe"
          & $sevenZip x "$env:TEMP/npcap.exe" -o"$env:TEMP/npcap-extract" -y | Out-Null
          # The installer is NOT laid out as "32-bit at the root, 64-bit in a
          # subdirectory". Npcap 1.88 ships three architectures under a naming
          # scheme that defeats every path- or name-based heuristic:
          #
          #   Packet.dll,       wpcap.dll        (root)             -> ARM64
          #   Packet_arm64.dll, wpcap_arm64.dll  (root)             -> ARM64
          #   Packet_x64.dll,   wpcap_x64.dll    (root)             -> x64
          #   Packet.dll,       wpcap.dll        ($SYSDIR/Npcap/)   -> x64
          #
          # There is no x64/ directory anywhere, so matching on one selects
          # nothing; and an exact-name match for "Packet.dll"/"wpcap.dll"
          # skips the _x64 copies entirely while picking up the ARM64 ones at
          # the root. Loading a non-x64 DLL into the x64 test binary aborts it
          # with STATUS_INVALID_IMAGE_FORMAT (0xc000007b) before a single test
          # runs. So key on the only thing that cannot drift with installer
          # layout: the PE header's machine type (0x8664 = x64). The two x64
          # copies above are byte-identical, so either is a correct pick.
          function Get-PeMachine([string]$Path) {
            try {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            } catch {
              return 0
            }
          }
          function Format-Machine([uint16]$Machine) {
            switch ($Machine) {
              0x8664  { "x64" }
              0x14c   { "x86" }
              0xaa64  { "ARM64" }
              default { "0x{0:x}" -f $Machine }
            }
          }
          # $PLUGINSDIR holds the installer's own NSIS plugins, never runtime
          # DLLs; excluding it keeps the candidate list to the real payload.
          $all = Get-ChildItem -Path "$env:TEMP/npcap-extract" -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(Packet|wpcap)' -and $_.FullName -notmatch '\$PLUGINSDIR' }
          Write-Host "Candidate DLLs found in the extracted installer:"
          $all | ForEach-Object { Write-Host ("  {0,-6} {1}" -f (Format-Machine (Get-PeMachine $_.FullName)), $_.FullName) }
          $destDir = "C:/npcap-runtime"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          # Stage under the canonical names the loader looks for, whichever
          # source file the x64 build happened to come from.
          $stagedCount = 0
          foreach ($stem in @("Packet", "wpcap")) {
            $pick = $all |
              Where-Object { $_.Name -match "^$stem" -and (Get-PeMachine $_.FullName) -eq 0x8664 } |
              Select-Object -First 1
            if ($pick) {
              Copy-Item $pick.FullName -Destination (Join-Path $destDir "$stem.dll") -Force
              Write-Host "staged $stem.dll (x64) <- $($pick.FullName)"
              $stagedCount++
            } else {
              Write-Warning "No x64 build of $stem.dll inside the extracted Npcap installer."
            }
          }
          if ($stagedCount -eq 2) {
            echo "$destDir" >> $env:GITHUB_PATH
          } else {
            throw "Incomplete Npcap runtime: both x64 DLLs are required for the runtime gate."
          }
      - name: Require unit, portable runtime and UDP sender tests
        run: >-
          cargo test --locked --no-fail-fast --no-default-features --features ttl-pnet
          --lib --test config_file_test --test malformed_input_test --test proptest_tlv
          --test mixed_clock_test --test required_micro_session_test
          --test session_ssid_validation_test --test sender_measurement_test
          --test startup_failure_test
          > windows-core.log 2>&1
        shell: bash
      - name: Full Windows suite (informational capture coverage)
        continue-on-error: true
        run: cargo test --locked --no-default-features --features ttl-pnet > windows-full.log 2>&1
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-results
          path: windows-*.log

  test-features:
    name: Test Features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: ""
            name: default
          - features: ttl-nix
            name: ttl-nix
          - features: ttl-pnet
            name: ttl-pnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-features-${{ matrix.name }}
      - name: Test (${{ matrix.name }})
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --locked --verbose --no-default-features --features ${{ matrix.features }}
          else
            cargo test --locked --verbose
          fi
        shell: bash

  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          # See pin rationale on the test job above.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Npcap SDK (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP/npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP/npcap-sdk.zip" -DestinationPath "C:/npcap-sdk"
          echo "LIB=C:/npcap-sdk/Lib/x64" >> $env:GITHUB_ENV
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check MSRV
        run: cargo check --all-features

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  package-deb:
    name: Package DEB
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-deb
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build DEB package
        run: cargo deb
      - name: Verify DEB package
        run: |
          DEB=$(ls target/debian/*.deb)
          echo "=== Package info ==="
          dpkg-deb --info "$DEB"
          echo "=== Package contents ==="
          dpkg-deb --contents "$DEB"
          dpkg-deb --contents "$DEB" | grep -q usr/bin/stamp-suite
          dpkg-deb --contents "$DEB" | grep -q lib/systemd/system/stamp-suite.service
          dpkg-deb --contents "$DEB" | grep -q usr/share/snmp/mibs/STAMP-SUITE-MIB.mib
          echo "All expected files present in DEB package."

  package-rpm:
    name: Package RPM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-rpm
      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release --all-features
      - name: Build RPM package
        run: cargo generate-rpm
      - name: Verify RPM package
        run: |
          RPM=$(ls target/generate-rpm/*.rpm)
          echo "=== Package info ==="
          rpm -qip "$RPM"
          echo "=== Package contents ==="
          rpm -qlp "$RPM"
          rpm -qlp "$RPM" | grep -q /usr/bin/stamp-suite
          rpm -qlp "$RPM" | grep -q stamp-suite.service
          rpm -qlp "$RPM" | grep -q STAMP-SUITE-MIB.mib
          echo "All expected files present in RPM package."

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build with Nix
        run: nix build --print-build-logs

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # Override the workflow-default contents-read token so the
    # rustsec/audit-check action can post its findings as a check-run
    # (it needs checks:write) and open issues for new advisories
    # (issues:write — optional but harmless).
    #
    # Overlap with `cargo-deny` below: both scan the RustSec advisory
    # database for known vulnerabilities in this crate's dependency tree,
    # so the [advisories] half of that job duplicates this one. Kept side
    # by side deliberately -- this job's value is the PR-annotated
    # check-run and issue-filing on new advisories, which
    # `cargo-deny-action` doesn't do; `cargo deny check` is kept as the
    # single command contributors run locally (see deny.toml) and also
    # covers licenses/bans/sources in the same pass. Small redundancy on
    # the advisories check, not wasted effort.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  mib-lint:
    name: MIB Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsmi tools
        # The package supplying `smilint` is named `smitools` on Ubuntu
        # 24.04+ and `libsmi2-bin` on older Debian/Ubuntu. Try the new
        # name first; fall back so the job survives a base-image bump.
        run: |
          sudo apt-get update
          sudo apt-get install -y smitools || sudo apt-get install -y libsmi2-bin
      - name: Lint STAMP-SUITE-MIB
        # Lint level 4 = errors and major warnings (style nits like missing
        # DESCRIPTION clauses are ignored). Raise to -l 6 once the MIB is
        # clean at level 5.
        run: smilint -l 4 mibs/STAMP-SUITE-MIB.mib
