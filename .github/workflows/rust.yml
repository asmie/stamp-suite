name: CI

# Branch pushes run through their pull request; pushes to the release
# branches and manual dispatches run directly.
on:
  workflow_call:
  push:
    branches: [master, 1.0-line]
  pull_request:
    branches: [master, 1.0-line]
  workflow_dispatch:

# A new push to a pull request cancels its previous run. Runs on the
# release branches always finish.
concurrency:
  group: rust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Default to a read-only token. A job that needs write access opts in with
# its own `permissions:` block; only security-audit does (checks and issues).
permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # `--features ttl-nix` alone builds the default backend on Linux,
          # so it has no leg of its own.
          - args: ""
            name: default
          - args: --all-features
            name: all-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ matrix.name }}
      - name: Clippy (${{ matrix.name }})
        run: cargo clippy --locked --all-targets ${{ matrix.args }} -- -D warnings
        shell: bash

  clippy-pnet:
    name: Clippy (pnet backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-pnet
      # The pnet receiver backend (src/receiver/pnet.rs) builds only with
      # `ttl-pnet` and without `ttl-nix`. Neither `clippy` leg compiles it
      # on Linux (both select nix), so this job is the only pnet-backend
      # lint gate and a separately addressable required check.
      - name: Clippy (ttl-pnet, no default features)
        run: cargo clippy --locked --no-default-features --features ttl-pnet --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust: stable
            features: --all-features
          - os: ubuntu-latest
            rust: beta
            features: --all-features
          # Windows has a separate bounded runtime gate below, with its
          # pinned Npcap DLL setup and explicit driver-free test targets.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.rust }}
      - name: Run tests
        run: cargo test --locked --verbose ${{ matrix.features }}
      - name: Check live benchmark accounting
        if: runner.os == 'Linux'
        run: cargo test --locked --example live_udp_bench ${{ matrix.features }}

  test-macos:
    name: Native macOS (${{ matrix.profile }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [default, all-features]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-macos-${{ matrix.profile }}
      # The Linux clippy jobs do not compile macOS-only code.
      - name: Clippy (macOS)
        run: cargo clippy --locked --all-targets ${{ matrix.profile == 'all-features' && '--all-features' || '' }} -- -D warnings
      - name: Run native tests and record evidence
        env:
          TOKIO_WORKER_THREADS: 2
        run: python3 scripts/run_native_tests.py --expected-platform darwin --profile ${{ matrix.profile }} --report native-macos-${{ matrix.profile }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macos-${{ matrix.profile }}
          path: |
            native-macos-${{ matrix.profile }}.json
            native-macos-${{ matrix.profile }}.log
          if-no-files-found: error

  # Runtime gate for codecs/configuration and UDP sender peers. The full
  # capture-dependent suite remains informational until a driver-backed
  # runner is available. DLL extraction does not install a capture driver.
  test-windows:
    name: "Windows runtime core (capture driver not required)"
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-windows
      - name: Install Npcap SDK (link-time import libs)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP/npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP/npcap-sdk.zip" -DestinationPath "C:/npcap-sdk"
          echo "LIB=C:/npcap-sdk/Lib/x64" >> $env:GITHUB_ENV
      - name: Extract Npcap runtime DLLs (installer unpacked, never run)
        shell: pwsh
        run: |
          # 7-Zip is not reliably preinstalled on GitHub-hosted Windows
          # images (actions/runner-images#9361); Chocolatey is, so install
          # 7z.exe through it when it is missing. `choco` needs no
          # credentials for a public package.
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "C:\Program Files\7-Zip\7z.exe")) {
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          if (-not $sevenZip) {
            choco install 7zip -y --no-progress | Out-Null
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          }
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-1.88.exe" -OutFile "$env:TEMP/npcap.exe"
          & $sevenZip x "$env:TEMP/npcap.exe" -o"$env:TEMP/npcap-extract" -y | Out-Null
          # Npcap 1.88 mixes architectures and names:
          #   Packet.dll / wpcap.dll at the root: ARM64
          #   Packet_arm64.dll / wpcap_arm64.dll at the root: ARM64
          #   Packet_x64.dll / wpcap_x64.dll at the root: x64
          #   Packet.dll / wpcap.dll under $SYSDIR/Npcap/: x64
          # Select by PE machine type (0x8664 = x64), not path or filename.
          # Loading ARM64 DLLs aborts x64 tests with 0xc000007b. Both x64 copies
          # are byte-identical.
          function Get-PeMachine([string]$Path) {
            try {
              $bytes = [System.IO.File]::ReadAllBytes($Path)
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            } catch {
              return 0
            }
          }
          function Format-Machine([uint16]$Machine) {
            switch ($Machine) {
              0x8664  { "x64" }
              0x14c   { "x86" }
              0xaa64  { "ARM64" }
              default { "0x{0:x}" -f $Machine }
            }
          }
          # $PLUGINSDIR holds the installer's own NSIS plugins, never runtime
          # DLLs; excluding it keeps the candidate list to the real payload.
          $all = Get-ChildItem -Path "$env:TEMP/npcap-extract" -Recurse -File -Filter "*.dll" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(Packet|wpcap)' -and $_.FullName -notmatch '\$PLUGINSDIR' }
          Write-Host "Candidate DLLs found in the extracted installer:"
          $all | ForEach-Object { Write-Host ("  {0,-6} {1}" -f (Format-Machine (Get-PeMachine $_.FullName)), $_.FullName) }
          $destDir = "C:/npcap-runtime"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          # Stage under the canonical names the loader looks for, whichever
          # source file the x64 build happened to come from.
          $stagedCount = 0
          foreach ($stem in @("Packet", "wpcap")) {
            $pick = $all |
              Where-Object { $_.Name -match "^$stem" -and (Get-PeMachine $_.FullName) -eq 0x8664 } |
              Select-Object -First 1
            if ($pick) {
              Copy-Item $pick.FullName -Destination (Join-Path $destDir "$stem.dll") -Force
              Write-Host "staged $stem.dll (x64) <- $($pick.FullName)"
              $stagedCount++
            } else {
              Write-Warning "No x64 build of $stem.dll inside the extracted Npcap installer."
            }
          }
          if ($stagedCount -eq 2) {
            echo "$destDir" >> $env:GITHUB_PATH
          } else {
            throw "Incomplete Npcap runtime: both x64 DLLs are required for the runtime gate."
          }
      # The Linux clippy jobs do not compile Windows-only code.
      - name: Clippy (Windows, pnet)
        shell: bash
        run: cargo clippy --locked --all-targets --no-default-features --features ttl-pnet -- -D warnings
      - name: Require unit, portable runtime and UDP sender tests
        run: >-
          cargo test --locked --no-fail-fast --no-default-features --features ttl-pnet
          --lib --test config_file_test --test malformed_input_test --test proptest_tlv
          --test mixed_clock_test --test required_micro_session_test
          --test session_ssid_validation_test --test sender_measurement_test
          --test startup_failure_test
          > windows-core.log 2>&1
        shell: bash
      - name: Require repeated mixed-clock sender startup
        shell: bash
        run: |
          : > windows-mixed-clock-repeat.log
          for attempt in $(seq 1 20); do
            echo "Mixed-clock repetition ${attempt}/20" >> windows-mixed-clock-repeat.log
            cargo test --locked --no-default-features --features ttl-pnet --test mixed_clock_test \
              >> windows-mixed-clock-repeat.log 2>&1 || exit "$?"
          done
      - name: Full Windows suite (informational capture coverage)
        continue-on-error: true
        run: cargo test --locked --no-default-features --features ttl-pnet > windows-full.log 2>&1
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-results
          path: windows-*.log

  test-features:
    name: Test Features
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - features: ""
            name: default
          - features: ttl-pnet
            name: ttl-pnet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-features-${{ matrix.name }}
      - name: Test (${{ matrix.name }})
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo test --locked --verbose --no-default-features --features ${{ matrix.features }}
          else
            cargo test --locked --verbose
          fi
        shell: bash

  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          # The Npcap SDK step below matches this exact runner label.
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install Npcap SDK (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.13.zip" -OutFile "$env:TEMP/npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP/npcap-sdk.zip" -DestinationPath "C:/npcap-sdk"
          echo "LIB=C:/npcap-sdk/Lib/x64" >> $env:GITHUB_ENV
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to Cargo.toml's rust-version, Debian trixie's rustc. Every
      # target (tests, benches, examples) must build there, not just the
      # library: distro builds run the test suite with the distro compiler.
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check MSRV
        run: cargo check --locked --all-features --all-targets

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc
      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: Package DEB and RPM
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - name: Install packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          cargo install cargo-deb cargo-generate-rpm --locked
      # One release build serves both packages; the DEB metadata enables
      # every feature, matching --all-features.
      - name: Build release binary
        run: cargo build --locked --release --all-features
      - name: Build packages
        run: |
          cargo deb --no-build
          cargo generate-rpm
      - name: Verify DEB package
        run: |
          DEB=$(ls target/debian/*.deb)
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          dpkg-deb --contents "$DEB" | grep -q usr/bin/stamp-suite
          dpkg-deb --contents "$DEB" | grep -q lib/systemd/system/stamp-suite.service
          dpkg-deb --contents "$DEB" | grep -q usr/share/snmp/mibs/STAMP-SUITE-MIB.mib
      - name: Verify RPM package
        run: |
          RPM=$(ls target/generate-rpm/*.rpm)
          rpm -qip "$RPM"
          rpm -qlp "$RPM"
          rpm -qlp "$RPM" | grep -q /usr/bin/stamp-suite
          rpm -qlp "$RPM" | grep -q stamp-suite.service
          rpm -qlp "$RPM" | grep -q STAMP-SUITE-MIB.mib

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - name: Build with Nix
        run: nix build --print-build-logs

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    # audit-check needs checks:write for PR annotations and issues:write for
    # new advisories. cargo-deny also checks advisories, plus licenses and
    # sources, but does not file issues or annotate PRs.
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo-deny (advisories, bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  mib-lint:
    name: MIB Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libsmi tools
        # The package supplying `smilint` is named `smitools` on Ubuntu
        # 24.04+ and `libsmi2-bin` on older Debian/Ubuntu. Try the new
        # name first; fall back so the job survives a base-image bump.
        run: |
          sudo apt-get update
          sudo apt-get install -y smitools || sudo apt-get install -y libsmi2-bin
      - name: Lint STAMP-SUITE-MIB
        # Lint level 4 = errors and major warnings (style nits like missing
        # DESCRIPTION clauses are ignored). Raise to -l 6 once the MIB is
        # clean at level 5.
        run: smilint -l 4 mibs/STAMP-SUITE-MIB.mib
