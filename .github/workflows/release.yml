name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # First job in the workflow — every other job needs this one, directly
  # or transitively, so a tag that doesn't match every version source (or
  # doesn't even package cleanly) never reaches build, test, publish, or
  # the GitHub Release.
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-preflight
      - name: Check version consistency
        shell: bash
        run: |
          set -uo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          changelog_version="$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md || true)"
          # Extract version from Debian changelog; regex assumes X.Y.Z-N revision-suffix format
          debian_version="$(head -n1 dist/debian/changelog | grep -oP '\(\K[0-9]+\.[0-9]+\.[0-9]+(?=-)' || true)"
          openwrt_version="$(grep -m1 -oP '^PKG_VERSION:=\K.+' dist/openwrt/Makefile || true)"
          # clap_mangen writes `.TH stamp-suite 1  "stamp-suite X.Y.Z"`; the page is a
          # committed snapshot (tests/man_page.rs), so a version bump without
          # `STAMP_UPDATE_MAN=1 cargo test --all-features --test man_page` shows up here.
          man_version="$(grep -m1 -oP '^\.TH stamp-suite 1 +"stamp-suite \K[0-9]+\.[0-9]+\.[0-9]+' dist/man/stamp-suite.1 || true)"
          # The Gentoo ebuild carries its version in the filename and fetches the tag archive.
          gentoo_version="$(ls dist/gentoo/net-analyzer/stamp-suite/stamp-suite-*.ebuild 2>/dev/null | grep -m1 -oP 'stamp-suite-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.ebuild$)' || true)"

          echo "tag=v$tag_version  Cargo.toml=$cargo_version  CHANGELOG.md=$changelog_version  dist/debian/changelog=$debian_version  dist/openwrt/Makefile=$openwrt_version  dist/man/stamp-suite.1=$man_version  dist/gentoo=$gentoo_version"

          fail=0
          check() {
            local label="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Could not extract a version from $label"
              fail=1
            elif [ "$value" != "$tag_version" ]; then
              echo "::error::Version mismatch: tag is v$tag_version but $label has $value (expected $tag_version)"
              fail=1
            fi
          }

          check "Cargo.toml"              "$cargo_version"
          check "CHANGELOG.md"            "$changelog_version"
          check "dist/debian/changelog"   "$debian_version"
          check "dist/openwrt/Makefile"   "$openwrt_version"
          check "dist/man/stamp-suite.1"  "$man_version"
          check "dist/gentoo ebuild"      "$gentoo_version"

          if [ "$fail" -ne 0 ]; then
            echo "One or more files are out of sync with tag v$tag_version — see the ::error:: annotations above. Fix the stale file(s) and re-tag." >&2
            exit 1
          fi

          echo "All version sources agree: $tag_version"
      - name: Dry-run crates.io packaging
        # Catches packaging errors (missing files, bad manifest metadata,
        # include/exclude mistakes) before any build/test time is spent.
        # This does NOT publish anything.
        env:
          # cargo publish requires a token even with --dry-run; value is never transmitted
          CARGO_REGISTRY_TOKEN: unused-dry-run-placeholder
        run: cargo publish --dry-run --locked

  # Stable source inputs for distribution packagers. GitHub's auto-generated
  # tag tarballs are not guaranteed byte-stable (their checksums changed in
  # 2023), so Arch/Gentoo/Fedora recipes need one we publish ourselves. The
  # vendor tarball is what Fedora (rust2rpm) and Gentoo (cargo.eclass) consume
  # for offline builds. Both are built reproducibly: sorted entries, fixed
  # ownership, mtimes pinned to the tagged commit, no gzip timestamp.
  source:
    name: Source Tarballs
    needs: [release-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble source and vendor tarballs
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_REF_NAME")"

          git archive --format=tar --prefix="stamp-suite-${ver}/" "$GITHUB_REF_NAME" \
            | gzip -9n > "stamp-suite-${ver}.tar.gz"

          cargo vendor --locked vendor > /dev/null
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" -cf - vendor \
            | xz -9 > "stamp-suite-${ver}-vendor.tar.xz"

          ls -l stamp-suite-*.tar.*
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            stamp-suite-*.tar.gz
            stamp-suite-*-vendor.tar.xz
          if-no-files-found: error

  # Linux DEB/RPM packages (existing) plus a plain tarball per target
  # (new — see the "Artifacts" work item). Kept as one job since it
  # already builds the release binary for these targets.
  package:
    name: Package ${{ matrix.target }}
    needs: [release-preflight]
    runs-on: ${{ matrix.runner }}
    # Only uploads build artifacts; does not touch the release. Narrow the
    # workflow-level `contents: write` down, matching `package-macos`.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm --locked
      - name: Build release binary
        run: cargo build --release --all-features --target ${{ matrix.target }}
      - name: Build DEB
        run: cargo deb --no-build --target ${{ matrix.target }}
      - name: Build RPM
        run: cargo generate-rpm --target ${{ matrix.target }}
      - name: Assemble tarball
        shell: bash
        run: |
          set -euo pipefail
          stage="stamp-suite-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/stamp-suite" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: stamp-suite-*.tar.gz
          if-no-files-found: error

  # macOS tarballs — new (Windows is explicitly out of scope for this
  # work item). No DEB/RPM here, macOS has neither.
  #
  # --all-features is known-broken when building for darwin (metrics ->
  # aws-lc-sys needs a native C toolchain quirk that doesn't hold up
  # here); build the explicit, metrics-free feature list instead so the
  # CoS/HW-timestamp/SNMP/control-plane surface is still covered.
  package-macos:
    name: Package macOS (${{ matrix.target }})
    needs: [release-preflight]
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --no-default-features --features ttl-nix,snmp,hwtstamp,control
      - name: Assemble tarball
        shell: bash
        run: |
          set -euo pipefail
          stage="stamp-suite-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/stamp-suite" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: stamp-suite-*.tar.gz
          if-no-files-found: error

  # Full test suite + strict clippy on the tagged commit. Nothing has
  # been proven to actually pass on this tag until this job is green;
  # publish and release both depend on it (directly or transitively).
  test-gate:
    name: Test Gate
    needs: [release-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-test-gate
      - name: Test (all features)
        run: cargo test --all-features
      - name: Clippy (all features)
        run: cargo clippy --all --all-features --tests -- -D warnings

  # Publishes to crates.io. Gated by the `crates-io` GitHub Environment
  # so a human has to click "approve" before this runs.
  #
  # ---- ONE-TIME REPO-OWNER SETUP (not performed by this workflow) ----
  # 1. Settings -> Environments -> New environment -> name it exactly
  #    `crates-io` -> add yourself (or the release approvers) as a
  #    required reviewer. This is what makes the publish job wait for a
  #    manual approval click before it runs.
  # 2. On crates.io: crate "stamp-suite" -> Settings -> Trusted
  #    Publishing -> add a GitHub Actions publisher with:
  #      repository:  asmie/stamp-suite
  #      workflow:    release.yml
  #      environment: crates-io
  #    This is what lets the OIDC exchange below (via
  #    rust-lang/crates-io-auth-action) mint a short-lived publish
  #    token — no long-lived API token is stored anywhere in the repo.
  # ----------------------------------------------------------------------
  publish:
    name: Publish to crates.io
    needs: [test-gate]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required for crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # ---- FALLBACK — only if Trusted Publishing (OIDC) genuinely -----
      # ---- cannot be enabled for this repo -----------------------------
      # Remove the two steps above and the `id-token: write` permission,
      # then publish with a long-lived token stored as a repo secret:
      #
      #   - name: cargo publish
      #     run: cargo publish --locked
      #     env:
      #       CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #
      # Trusted Publishing is strongly preferred: there is no secret to
      # rotate or leak, and crates.io can attest the token only ever
      # came from this exact repo/workflow/environment.
      # -------------------------------------------------------------------

  release:
    name: Publish GitHub Release
    needs: [source, package, package-macos, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # Sigstore signing for the provenance attestation
      attestations: write  # store the attestation on the repository
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: tarball-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          name: source
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # The packages-* artifacts preserve the debian/ and generate-rpm/
          # directories they were uploaded under (two upload paths share the
          # target/<triple>/ root). Flatten before hashing so the globs match
          # and SHA256SUMS entries carry the same basenames the release
          # attaches its assets under.
          find . -mindepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.tar.xz' \) \
            -exec mv -t . {} +
          sha256sum *.deb *.rpm *.tar.gz *.tar.xz > SHA256SUMS
          cat SHA256SUMS

      # Signed build provenance for every asset, keyless via Sigstore. Needs
      # no repository secret. Verify with:
      #   gh attestation verify <asset> --repo asmie/stamp-suite
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.tar.xz
            dist/SHA256SUMS

      # Detached GPG signature over SHA256SUMS — the form Debian/Gentoo/Arch
      # maintainers habitually check (`gpg --verify SHA256SUMS.asc SHA256SUMS`
      # then `sha256sum -c`). Skipped, not failed, when no key is configured,
      # so the attestation above is always present and the signature is an
      # additive extra.
      #
      # ---- ONE-TIME REPO-OWNER SETUP (not performed by this workflow) ----
      # 1. Create (or pick) a signing key and export the private key ASCII-
      #    armored: `gpg --armor --export-secret-keys <KEYID>`.
      # 2. Settings -> Secrets and variables -> Actions -> New repository
      #    secret `RELEASE_GPG_PRIVATE_KEY` with that armored block; add
      #    `RELEASE_GPG_PASSPHRASE` too if the key has one.
      # 3. Publish the public key (`gpg --armor --export <KEYID>`) where
      #    packagers can find it — e.g. commit it as dist/RELEASE_KEY.asc and
      #    upload to keys.openpgp.org — and note the fingerprint in README.md.
      # ----------------------------------------------------------------------
      - name: Sign SHA256SUMS (if a release key is configured)
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::notice::RELEASE_GPG_PRIVATE_KEY not set; skipping GPG signature (Sigstore attestation still published)"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          passphrase_args=()
          if [ -n "${GPG_PASSPHRASE}" ]; then
            passphrase_args=(--pinentry-mode loopback --passphrase-fd 0)
          fi
          printf '%s' "${GPG_PASSPHRASE}" \
            | gpg --batch --yes "${passphrase_args[@]}" --armor --detach-sign \
                  --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.tar.gz
            dist/**/*.tar.xz
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          generate_release_notes: true
