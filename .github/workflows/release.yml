name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Every other job needs this one, directly or transitively, so a tag that
  # does not match every version source (or does not package cleanly) never
  # reaches build, test, publish, or the GitHub Release.
  release-preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-preflight
      - name: Check version consistency
        shell: bash
        run: python3 scripts/check_release_metadata.py --version "${GITHUB_REF_NAME#v}"
      - name: Check locked dependency notices
        run: python3 scripts/third_party_notices.py --validate-release-profiles
      - name: Dry-run crates.io packaging
        # Catches packaging errors (missing files, bad manifest metadata,
        # include/exclude mistakes) before any build/test time is spent.
        # This does NOT publish anything.
        env:
          # cargo publish requires a token even with --dry-run; value is never transmitted
          CARGO_REGISTRY_TOKEN: unused-dry-run-placeholder
        run: cargo publish --dry-run --locked

  # Stable source inputs for distribution packagers. GitHub's auto-generated
  # tag tarballs are not guaranteed byte-stable (their checksums changed in
  # 2023), so Arch/Gentoo/Fedora recipes need one we publish ourselves. The
  # vendor tarball is what Fedora (rust2rpm) and Gentoo (cargo.eclass) consume
  # for offline builds. Both are built reproducibly: sorted entries, fixed
  # ownership, mtimes pinned to the tagged commit, no gzip timestamp.
  source:
    name: Source Tarballs
    needs: [release-preflight]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Assemble source and vendor tarballs
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_REF_NAME")"

          git archive --format=tar --prefix="stamp-suite-${ver}/" "$GITHUB_REF_NAME" \
            | gzip -9n > "stamp-suite-${ver}.tar.gz"

          python3 scripts/render_openwrt.py --archive "stamp-suite-${ver}.tar.gz" --output "stamp-suite-${ver}-openwrt.mk"

          cargo vendor --locked vendor > /dev/null
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" -cf - vendor \
            | xz -9 > "stamp-suite-${ver}-vendor.tar.xz"

          ls -l stamp-suite-*.tar.*
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: source
          path: |
            stamp-suite-*.tar.gz
            stamp-suite-*-vendor.tar.xz
            stamp-suite-*-openwrt.mk
          if-no-files-found: error

  # Linux DEB/RPM packages plus a plain tarball per target, in one job
  # because it already builds the release binary for these targets.
  package:
    name: Package ${{ matrix.target }}
    needs: [release-preflight]
    runs-on: ${{ matrix.runner }}
    # Only uploads build artifacts; does not touch the release. Narrow the
    # workflow-level `contents: write` down, matching `package-macos`.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Install packagers
        run: |
          cargo install cargo-deb --version 3.8.0 --locked
          cargo install cargo-generate-rpm --version 0.21.0 --locked
      - name: Build release binary
        run: cargo build --locked --release --all-features --target ${{ matrix.target }}
      - name: Generate target dependency notices
        run: python3 scripts/third_party_notices.py --target ${{ matrix.target }}
      - name: Build DEB
        run: cargo deb --no-build --target ${{ matrix.target }}
      - name: Build RPM
        run: cargo generate-rpm --target ${{ matrix.target }}
      - name: Assemble tarball
        shell: bash
        run: |
          set -euo pipefail
          stage="stamp-suite-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/stamp-suite" "$stage/"
          cp LICENSE THIRD_PARTY_NOTICES.txt README.md CHANGELOG.md SECURITY.md "$stage/"
          mkdir -p "$stage/examples"
          cp examples/*.toml "$stage/examples/"
          tar -czf "${stage}.tar.gz" "$stage"
      - name: Verify notices in every binary package
        run: python3 scripts/check_packaged_notices.py "target/${{ matrix.target }}/debian/*.deb" "target/${{ matrix.target }}/generate-rpm/*.rpm" "stamp-suite-*.tar.gz"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debian/*.deb
            target/${{ matrix.target }}/generate-rpm/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tarball-${{ matrix.target }}
          path: stamp-suite-*.tar.gz
          if-no-files-found: error

  # macOS tarballs for the socket backend.
  #
  # Builds the nix backend with every optional feature. The pnet backend is
  # left out because nix is the macOS default.
  package-macos:
    name: Package macOS (${{ matrix.target }})
    needs: [release-preflight]
    runs-on: macos-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} --no-default-features --features ttl-nix,snmp,hwtstamp,control,metrics
      - name: Generate target dependency notices
        run: python3 scripts/third_party_notices.py --target ${{ matrix.target }}
      - name: Assemble tarball
        shell: bash
        run: |
          set -euo pipefail
          stage="stamp-suite-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/stamp-suite" "$stage/"
          cp LICENSE THIRD_PARTY_NOTICES.txt README.md CHANGELOG.md SECURITY.md "$stage/"
          mkdir -p "$stage/examples"
          cp examples/*.toml "$stage/examples/"
          tar -czf "${stage}.tar.gz" "$stage"
      - name: Verify packaged notices
        run: python3 scripts/check_packaged_notices.py "stamp-suite-*.tar.gz"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tarball-${{ matrix.target }}
          path: stamp-suite-*.tar.gz
          if-no-files-found: error

  package-windows:
    name: Package Windows (x64)
    needs: [release-preflight]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-x86_64-pc-windows-msvc
      - name: Install Npcap SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile "$env:TEMP/npcap-sdk.zip"
          Expand-Archive -Path "$env:TEMP/npcap-sdk.zip" -DestinationPath "C:/npcap-sdk"
          "LIB=C:/npcap-sdk/Lib/x64;$env:LIB" >> $env:GITHUB_ENV
      - name: Build release binary
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --no-default-features --features ttl-pnet,metrics,control
      - name: Generate target dependency notices
        run: python scripts/third_party_notices.py --target x86_64-pc-windows-msvc
      - name: Check executable stack reserve
        run: python scripts/check_release_metadata.py --windows-binary target/x86_64-pc-windows-msvc/release/stamp-suite.exe
      - name: Assemble archive
        shell: pwsh
        run: |
          $stage = "stamp-suite-$env:GITHUB_REF_NAME-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/stamp-suite.exe, LICENSE, THIRD_PARTY_NOTICES.txt, README.md, CHANGELOG.md, SECURITY.md -Destination $stage
          New-Item -ItemType Directory -Path "$stage/examples" | Out-Null
          Copy-Item examples/*.toml -Destination "$stage/examples"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
      - name: Verify packaged notices
        run: python scripts/check_packaged_notices.py "stamp-suite-*.zip"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tarball-x86_64-pc-windows-msvc
          path: stamp-suite-*.zip
          if-no-files-found: error

  # Reuse the same backend, platform, MSRV and conformance gates on the tag.
  test-gate:
    needs: [release-preflight]
    uses: ./.github/workflows/rust.yml
    permissions:
      contents: read
      checks: write
      issues: write

  conformance-gate:
    needs: [release-preflight]
    uses: ./.github/workflows/conformance.yml
    permissions:
      contents: read

  # Publish to crates.io after approval through the `crates-io` environment.
  # Repository setup:
  # 1. Create the `crates-io` GitHub environment with a required reviewer.
  # 2. In crates.io Trusted Publishing, add a GitHub Actions publisher:
  #      repository:  asmie/stamp-suite
  #      workflow:    release.yml
  #      environment: crates-io
  # The OIDC action obtains a short-lived token; no API token is stored here.
  publish:
    name: Publish to crates.io
    needs: [test-gate, conformance-gate, source, package, package-macos, package-windows]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # required for crates.io Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      # If Trusted Publishing is unavailable, remove both OIDC steps and
      # `id-token: write`, then use a repository secret:
      #
      #   - name: cargo publish
      #     run: cargo publish --locked
      #     env:
      #       CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      #
      # This token needs manual rotation.

  release:
    name: Publish GitHub Release
    needs: [source, package, package-macos, package-windows, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # Sigstore signing for the provenance attestation
      attestations: write  # store the attestation on the repository
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: tarball-*
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          name: source
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          # The packages-* artifacts preserve the debian/ and generate-rpm/
          # directories they were uploaded under (two upload paths share the
          # target/<triple>/ root). Flatten before hashing so the globs match
          # and SHA256SUMS entries carry the same basenames the release
          # attaches its assets under.
          find . -mindepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.zip' \) \
            -exec mv -t . {} +
          sha256sum *.deb *.rpm *.tar.gz *.tar.xz *.zip *.mk > SHA256SUMS
          cat SHA256SUMS

      # Signed build provenance for every asset, keyless via Sigstore. Needs
      # no repository secret. Verify with:
      #   gh attestation verify <asset> --repo asmie/stamp-suite
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.tar.xz
            dist/*.mk
            dist/*.zip
            dist/SHA256SUMS

      # Sign SHA256SUMS when a GPG key is configured; otherwise skip signing.
      # The attestation above is produced in either case.
      # Repository setup:
      # 1. Export the private key: `gpg --armor --export-secret-keys <KEYID>`.
      # 2. Store it in the RELEASE_GPG_PRIVATE_KEY Actions secret. Set
      #    RELEASE_GPG_PASSPHRASE if the key needs one.
      # 3. Publish the public key (`gpg --armor --export <KEYID>`) and record its
      #    fingerprint in README.md so packagers can verify the signature.
      - name: Sign SHA256SUMS (if a release key is configured)
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::notice::RELEASE_GPG_PRIVATE_KEY not set; skipping GPG signature (Sigstore attestation still published)"
            exit 0
          fi
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          passphrase_args=()
          if [ -n "${GPG_PASSPHRASE}" ]; then
            passphrase_args=(--pinentry-mode loopback --passphrase-fd 0)
          fi
          printf '%s' "${GPG_PASSPHRASE}" \
            | gpg --batch --yes "${passphrase_args[@]}" --armor --detach-sign \
                  --output SHA256SUMS.asc SHA256SUMS
          gpg --batch --verify SHA256SUMS.asc SHA256SUMS
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.tar.gz
            dist/**/*.tar.xz
            dist/**/*-openwrt.mk
            dist/**/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.asc
          generate_release_notes: true
