name: Conformance evidence

on:
  workflow_call:
  push:
    branches: [master, 1.0-line]
  pull_request:
    branches: [master, 1.0-line]
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TOKIO_WORKER_THREADS: 2

jobs:
  evidence:
    name: Documentation and matrix consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test evidence checkers and independent wire oracle
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check matrix counts
        run: python3 scripts/check_conformance_counts.py --json
      - name: Check local documentation links
        run: python3 scripts/check_doc_links.py --json > doc-links.json
      - name: Check source citations and report test-evidence backlog
        run: python3 scripts/check_conformance_citations.py --json --details > citations.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: conformance-citations
          path: |
            citations.json
            doc-links.json

  independent-wire:
    name: Independent UDP fixtures (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            flags: ''
          - name: all-features
            flags: '--all-features'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - id: build
        run: cargo build --locked ${{ matrix.flags }}
      - name: Require independent protocol combinations
        run: python3 scripts/interop_stamp.py --binary target/debug/stamp-suite --report interop.json
      - name: Require independent successor BER exchanges in both roles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 scripts/interop_ber.py --binary target/debug/stamp-suite --report ber-interop.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: independent-wire-${{ matrix.name }}
          path: |
            interop.json
            ber-interop.json
          if-no-files-found: error

  release-integration:
    name: Control and reference SNMP master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install reference tools without starting a system service
        run: |
          sudo apt-get update
          mkdir -p /tmp/stamp-snmp-packages/root
          cd /tmp/stamp-snmp-packages
          sudo apt-get --download-only --reinstall --yes \
            -o Dir::Cache::archives=/tmp/stamp-snmp-packages \
            install snmp snmpd libsnmp40t64 libsnmp-base libwrap0 libpci3
          for package in *.deb; do dpkg-deb -x "$package" root; done
          echo "/tmp/stamp-snmp-packages/root/usr/bin" >> "$GITHUB_PATH"
          echo "/tmp/stamp-snmp-packages/root/usr/sbin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/tmp/stamp-snmp-packages/root/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"
      - run: cargo build --locked --all-features
      - name: Require authenticated control and reference-master exchanges
        run: python3 scripts/release_checks.py --binary target/debug/stamp-suite --report release-integration.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: release-integration
          path: release-integration.json
          if-no-files-found: error

  fuzz-build:
    name: Locked fuzz harness build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml

  privileged:
    name: Required privileged wire tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Install wire-test tools
        run: sudo apt-get update && sudo apt-get install -y iproute2 tcpdump util-linux ethtool
      - name: Build pnet fixture and tests without root
        run: |
          cargo build --locked --no-default-features --features ttl-pnet --target-dir target/pnet
          cargo test --locked --no-default-features --features ttl-pnet --target-dir target/pnet --test pnet_loopback_test --test header_request_wire_test --test header_reflection_wire_test --test pnet_endpoint_test --test pnet_nested_headers_test --no-run --message-format=json > pnet-artifacts.json
      - name: Require pnet wire tests
        run: python3 scripts/run_privileged_test.py pnet-artifacts.json pnet_loopback_test 3 sudo -n env STAMP_REQUIRE_PRIVILEGED=1 TOKIO_WORKER_THREADS=2
      - name: Require pnet-profile sender header requests
        run: python3 scripts/run_privileged_test.py pnet-artifacts.json header_request_wire_test 1 sudo -n unshare --net --fork env STAMP_HEADER_NETNS_TESTS=1 TOKIO_WORKER_THREADS=2
      - name: Require pnet header reflection policy and control
        run: python3 scripts/run_privileged_test.py pnet-artifacts.json header_reflection_wire_test 1 sudo -n unshare --net --fork env STAMP_HEADER_NETNS_TESTS=1 TOKIO_WORKER_THREADS=2
      - name: Require pnet assigned endpoints and family startup failures
        run: >-
          python3 scripts/run_privileged_test.py pnet-artifacts.json pnet_endpoint_test 3
          sudo -n unshare --net --fork env STAMP_PARENT_NETNS="$(readlink /proc/self/ns/net)"
          STAMP_PNET_ENDPOINT_TESTS=1 TOKIO_WORKER_THREADS=2
      - name: Require nested IP capture and header reflection
        run: >-
          python3 scripts/run_privileged_test.py pnet-artifacts.json pnet_nested_headers_test 1
          sudo -n unshare --net --fork env STAMP_PARENT_NETNS="$(readlink /proc/self/ns/net)"
          STAMP_PNET_HEADER_TESTS=1 TOKIO_WORKER_THREADS=2
      - name: Build nix namespace tests without root
        run: cargo test --locked --all-features --test netns_conformance --test route_mtu_test --test header_request_wire_test --test header_reflection_wire_test --no-run --message-format=json > netns-artifacts.json
      - name: Require nix-profile sender header requests
        run: python3 scripts/run_privileged_test.py netns-artifacts.json header_request_wire_test 1 sudo -n unshare --net --fork env STAMP_HEADER_NETNS_TESTS=1 TOKIO_WORKER_THREADS=2
      - name: Require nix header reflection policy and control
        run: python3 scripts/run_privileged_test.py netns-artifacts.json header_reflection_wire_test 1 sudo -n unshare --net --fork env STAMP_HEADER_NETNS_TESTS=1 TOKIO_WORKER_THREADS=2
      - name: Require namespace and successful SRv6 transit scenarios
        shell: bash
        # Private mount/network namespaces isolate /run/netns and sysctls.
        run: |
          sudo -n unshare --mount --net --fork --mount-proc bash -euc '
            mount --make-rprivate /
            mkdir -p /run/netns
            mount -t tmpfs tmpfs /run/netns
            ip link set lo up
            sysctl -w net.ipv6.conf.all.seg6_enabled=1
            STAMP_NETNS_CAPTURE_DIR="$PWD/netns-captures" STAMP_REQUIRE_PRIVILEGED=1 STAMP_NETNS_TESTS=1 STAMP_NETNS_PNET_BIN="$PWD/target/pnet/debug/stamp-suite" TOKIO_WORKER_THREADS=2 python3 scripts/run_privileged_test.py netns-artifacts.json netns_conformance 9
          ' 2>&1 | tee netns.log
      - name: Require sender and reply-route MTU tests
        run: python3 scripts/run_privileged_test.py netns-artifacts.json route_mtu_test 2 sudo -n unshare --net --fork env STAMP_REQUIRE_PRIVILEGED=1 STAMP_MTU_NETNS_TESTS=1 TOKIO_WORKER_THREADS=2
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: privileged-test-artifacts
          path: |
            *-artifacts.json
            netns.log
            netns-captures/*.pcap
