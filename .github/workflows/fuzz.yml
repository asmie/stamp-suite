name: Fuzz

# Fuzz targets are excluded from the default cargo workspace and require
# nightly + cargo-fuzz. Run on demand or weekly, not on every PR.
on:
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Per-target fuzz duration (seconds)"
        required: false
        default: "60"
  schedule:
    # Sunday 03:30 UTC.
    - cron: "30 3 * * 0"

# Read-only token. Uploading crash artifacts on failure does not need
# write access to the repository.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - tlv_list_parse
          - tlv_list_parse_lenient
          - raw_tlv_parse
          - residual_ber_value
          - packet_unauth_parse
          - packet_auth_parse
          - agentx_decode_header
          - agentx_decode_oid
          - process_stamp_packet
          - sender_reply
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      # A prebuilt binary; building cargo-fuzz from source takes minutes per leg.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.87.24
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
      # Each run starts from the corpus the previous run grew.
      - name: Restore corpus
        uses: actions/cache@v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seed successor BER inputs
        if: matrix.target == 'residual_ber_value' || matrix.target == 'process_stamp_packet'
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          vectors = json.loads(Path('tests/fixtures/residual-ber/values.json').read_text())
          target = os.environ['FUZZ_TARGET']
          corpus = Path('fuzz/corpus') / target
          corpus.mkdir(parents=True, exist_ok=True)
          for group in ('valid', 'invalid'):
              for vector in vectors[group]:
                  value = bytearray.fromhex(vector['value_hex'])
                  if target == 'process_stamp_packet':
                      # Convert the fixture-local pattern type to the active
                      # sub-TLV type, including malformed length cases.
                      offset = 8
                      while offset + 4 <= len(value):
                          if value[offset + 1] == vectors['pattern_type']:
                              value[offset + 1] = 241
                          offset += 4 + int.from_bytes(value[offset + 2:offset + 4], 'big')
                      outer = bytes([128, 243]) + len(value).to_bytes(2, 'big') + value
                      padding = bytes([128, 1, 0, 64]) + bytes.fromhex('ff00ff00') * 16
                      # Harness selector, unauthenticated base, BER, padding.
                      value = bytes(45) + outer + padding
                  (corpus / ('successor-ber-' + vector['id'])).write_bytes(value)
          PY
      - name: Run fuzz target
        env:
          # Use env-var indirection per GitHub security guidance: matrix
          # values are author-controlled, but pulling them through env
          # protects against future template changes that might let
          # untrusted input slip in.
          FUZZ_TARGET: ${{ matrix.target }}
          DURATION: ${{ github.event.inputs.duration_secs || '60' }}
        run: |
          cd fuzz
          cargo metadata --locked --format-version 1 > /dev/null
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$FUZZ_TARGET" -- -max_total_time="$DURATION"
      - name: Upload crashes (if any)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
