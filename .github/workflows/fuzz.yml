name: Fuzz

# Fuzz targets are excluded from the default cargo workspace and require
# nightly + cargo-fuzz. Run on demand or weekly, not on every PR.
on:
  workflow_dispatch:
    inputs:
      duration_secs:
        description: "Per-target fuzz duration (seconds)"
        required: false
        default: "60"
  schedule:
    # Sunday 03:30 UTC.
    - cron: "30 3 * * 0"

# Read-only token. Uploading crash artifacts on failure does not need
# write access to the repository.
permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - tlv_list_parse
          - tlv_list_parse_lenient
          - raw_tlv_parse
          - packet_unauth_parse
          - packet_auth_parse
          - agentx_decode_header
          - agentx_decode_oid
          - process_stamp_packet
          - sender_reply
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
      # A prebuilt binary; building cargo-fuzz from source takes minutes per leg.
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2.87.24
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: fuzz
          key: fuzz-${{ matrix.target }}
      # Each run starts from the corpus the previous run grew.
      - name: Restore corpus
        uses: actions/cache@v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Run fuzz target
        env:
          # Use env-var indirection per GitHub security guidance: matrix
          # values are author-controlled, but pulling them through env
          # protects against future template changes that might let
          # untrusted input slip in.
          FUZZ_TARGET: ${{ matrix.target }}
          DURATION: ${{ github.event.inputs.duration_secs || '60' }}
        run: |
          cd fuzz
          cargo metadata --locked --format-version 1 > /dev/null
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$FUZZ_TARGET" -- -max_total_time="$DURATION"
      - name: Upload crashes (if any)
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/
            fuzz/corpus/${{ matrix.target }}/
          if-no-files-found: ignore
