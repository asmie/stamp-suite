# cargo-deny configuration for stamp-suite.
#
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run locally:
#   cargo install cargo-deny --locked   # if not already on PATH
#   cargo deny check
# CI: the `cargo-deny` job in .github/workflows/rust.yml runs the same
# checks via EmbarkStudios/cargo-deny-action@v2.
#
# Overlap with the `security-audit` job (rustsec/audit-check): both scan
# the RustSec advisory database for known vulnerabilities in this crate's
# dependency tree, so on paper they duplicate each other for that one
# check. Kept side by side deliberately: `audit-check` posts its findings
# as a GitHub check-run with inline PR annotations and can open issues for
# newly published advisories, which `cargo-deny-action` does not do;
# `cargo deny check` is additionally the single command contributors run
# locally and also covers licenses/bans/sources in the same pass. Small
# redundancy on the advisories check, not wasted effort.

[graph]
# Check the full dependency graph, including crates only pulled in by
# optional features (metrics, control, snmp, hwtstamp, ttl-nix, ttl-pnet),
# so `cargo deny check` with no extra flags matches what CI's
# --all-features builds actually link.
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# As of the cargo-deny 0.16+ config schema, vulnerability advisories are
# unconditionally treated as errors -- this is no longer a configurable
# lint level, so there is nothing to set here to get "vulnerability=deny"
# semantics (and nothing to accidentally weaken either).
#
# `unmaintained`/`unsound` also changed meaning: they now select *scope*
# (which part of the graph is checked), not severity. "all" is the
# upstream default and matches the intent of the original
# "unmaintained=warn" requirement: flag unmaintained crates anywhere in
# the tree, but only as a warning (cargo-deny's own default severity for
# unmaintained/unsound advisories), never a hard failure.
unmaintained = "all"
unsound = "all"
# Yanked crate versions in Cargo.lock: warn, don't fail the build.
yanked = "warn"
ignore = [
    # No advisories are currently ignored. If one needs to be silenced
    # temporarily, add it here with a `reason` explaining why and a
    # follow-up plan, e.g.:
    # { id = "RUSTSEC-0000-0000", reason = "no fix available yet; tracked in #123" },
]

[licenses]
# Allow-list derived from the actual resolved dependency tree
# (`cargo metadata --all-features`, cross-checked with `cargo deny list`)
# as of Cargo.lock for stamp-suite 0.9.0. Every license expression in the
# tree resolves against this list; see the comment above each entry for
# which crate(s) specifically need it.
allow = [
    "MIT",          # the overwhelming majority of the tree, incl. this crate
    "Apache-2.0",   # equally common, usually dual-licensed with MIT
    "BSD-2-Clause", # e.g. zerocopy (BSD-2-Clause OR Apache-2.0 OR MIT)
    "BSD-3-Clause", # e.g. subtle, and part of the aws-lc-sys AND-expression
    "ISC",          # e.g. rustls-webpki, untrusted, and part of aws-lc-rs/ring
    "Unicode-3.0",  # unicode-ident: (MIT OR Apache-2.0) AND Unicode-3.0
    "Zlib",         # foldhash
    "CC0-1.0",      # dunce (CC0-1.0 OR MIT-0 OR Apache-2.0)
    "MIT-0",        # alternate branch of dunce's license expression
    "Unlicense",    # aho-corasick, memchr, walkdir, same-file, winapi-util
    "BSL-1.0",      # ryu (Apache-2.0 OR BSL-1.0)
]
confidence-threshold = 0.8

[bans]
# The tree has a handful of known, harmless duplicate versions (e.g.
# transitive deps pulled at different major versions by axum/hyper/rustls
# vs. older consumers). Warn so it stays visible without failing CI.
multiple-versions = "warn"
# No dependency should ever pin `*` -- that silently accepts any future
# (possibly malicious or breaking) release.
wildcards = "deny"

[sources]
# Every dependency must come from crates.io; no git or unknown-registry
# sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
